name: Deploy static apps

on:
  push:
    branches:
      - main
    paths:
      - apps/admin/**
      - apps/billing-admin/**
      - apps/client/**
      - apps/coach/**
      - packages/api-client/**
      - packages/ui/**
      - .github/scripts/deploy-static.sh
      - .github/scripts/deployment-revision.mjs
      - .github/scripts/verify-deployed-revision.mjs
      - .github/scripts/write-static-version.mjs
      - .github/workflows/deploy-static.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - turbo.json
  workflow_dispatch:
    inputs:
      confirm_nonprod:
        description: Confirm publication to the four NonProd static applications
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-static-nonprod
  cancel-in-progress: false

jobs:
  deploy-nonprod-static:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.confirm_nonprod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nonprod-static
    env:
      AWS_REGION: us-east-1
      DEPLOYMENT_ENVIRONMENT: nonprod
      ROLE_TO_ASSUME: arn:aws:iam::124074140404:role/traverse-nonprod-github-deploy
      TRAVERSE_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app shells
        run: pnpm build

      - name: Write static revision manifests
        run: node .github/scripts/write-static-version.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}

      - name: Publish static apps
        run: bash .github/scripts/deploy-static.sh

      - name: Verify public staging revisions
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REVISION_FIELD: commit
          VERIFY_URLS: >-
            https://staging-app.traversecoaching.com/version.json,
            https://staging-client.traversecoaching.com/version.json
        run: node .github/scripts/verify-deployed-revision.mjs
